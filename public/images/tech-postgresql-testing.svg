<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node { transform-box: fill-box; transform-origin: 50% 50%; animation: pulseGlow 4s ease-in-out infinite; }
    @keyframes pulseGlow {
      0%, 60%, 100% { transform: scale(1); }
      15%, 35% { transform: scale(1.05); }
    }
    .line-dash { stroke-dasharray: 8 6; animation: dashFlow 1.8s linear infinite; }
    @keyframes dashFlow { to { stroke-dashoffset: -28; } }
    .dot-right { animation: dotRight 4s linear infinite; }
    @keyframes dotRight {
      0% { transform: translateX(0); opacity: 0; }
      8% { opacity: 1; }
      45% { transform: translateX(85px); opacity: 1; }
      50%, 100% { transform: translateX(85px); opacity: 0; }
    }
    .dot-left { animation: dotLeft 4s linear infinite; animation-delay: 1s; }
    @keyframes dotLeft {
      0% { transform: translateX(0); opacity: 0; }
      8% { opacity: 1; }
      45% { transform: translateX(-85px); opacity: 1; }
      50%, 100% { transform: translateX(-85px); opacity: 0; }
    }
    .dot-down { animation: dotDown 4s linear infinite; animation-delay: 2s; }
    @keyframes dotDown {
      0% { transform: translateY(0); opacity: 0; }
      8% { opacity: 1; }
      45% { transform: translateY(58px); opacity: 1; }
      50%, 100% { transform: translateY(58px); opacity: 0; }
    }
    .check { opacity: 0; animation: checkFade 4s linear infinite; }
    @keyframes checkFade {
      0% { opacity: 0; }
      3% { opacity: 1; }
      22% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .node, .line-dash, .dot-right, .dot-left, .dot-down, .check { animation: none !important; }
      .dot-right, .dot-left, .dot-down { opacity: 0; }
      .check:first-of-type { opacity: 1; }
    }
  </style>

  <rect width="600" height="400" fill="#111827"/>
  <text x="50" y="60" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#6b7280">DATABASE VALIDATION FLOW</text>

  <!-- Foreign-key relationships -->
  <line x1="160" y1="146" x2="245" y2="146" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line class="line-dash" x1="160" y1="146" x2="245" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="440" y1="146" x2="355" y2="146" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line class="line-dash" x1="440" y1="146" x2="355" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="172" x2="300" y2="230" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line class="line-dash" x1="300" y1="172" x2="300" y2="230" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <circle class="dot-right" cx="160" cy="146" r="5" fill="#e5e7eb"/>
  <circle class="dot-left" cx="440" cy="146" r="5" fill="#e5e7eb"/>
  <circle class="dot-down" cx="300" cy="172" r="5" fill="#e5e7eb"/>

  <text x="202" y="136" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">FK</text>
  <text x="398" y="136" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">FK</text>
  <text x="312" y="205" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6b7280">FK</text>

  <!-- customers -->
  <g class="node" style="animation-delay:0s">
    <rect x="50" y="120" width="110" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="143" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0" text-anchor="middle">customers</text>
    <text x="105" y="160" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">PK customer_id</text>
  </g>

  <!-- orders -->
  <g class="node" style="animation-delay:1s">
    <rect x="245" y="120" width="110" height="52" rx="10" fill="#336791" stroke="#7fb0d8" stroke-width="2"/>
    <text x="300" y="143" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">orders</text>
    <text x="300" y="160" font-family="'Courier New', monospace" font-size="10" fill="#dbeafe" text-anchor="middle">PK order_id</text>
  </g>

  <!-- products -->
  <g class="node" style="animation-delay:2s">
    <rect x="440" y="120" width="110" height="52" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="495" y="143" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0" text-anchor="middle">products</text>
    <text x="495" y="160" font-family="'Courier New', monospace" font-size="10" fill="#4ade80" text-anchor="middle">PK product_id</text>
  </g>

  <!-- payments -->
  <g class="node" style="animation-delay:3s">
    <rect x="245" y="230" width="110" height="52" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
    <text x="300" y="253" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0" text-anchor="middle">payments</text>
    <text x="300" y="270" font-family="'Courier New', monospace" font-size="10" fill="#facc15" text-anchor="middle">PK payment_id</text>
  </g>

  <!-- Rotating validation results -->
  <g class="check" style="animation-delay:0s">
    <rect x="170" y="309" width="260" height="26" rx="13" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
    <text x="300" y="326" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#4ade80" text-anchor="middle">✓ Referential integrity · 0 violations</text>
  </g>
  <g class="check" style="animation-delay:1s">
    <rect x="170" y="309" width="260" height="26" rx="13" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
    <text x="300" y="326" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#4ade80" text-anchor="middle">✓ Business rules · 0 violations</text>
  </g>
  <g class="check" style="animation-delay:2s">
    <rect x="170" y="309" width="260" height="26" rx="13" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
    <text x="300" y="326" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#4ade80" text-anchor="middle">✓ Duplicate data · 0 violations</text>
  </g>
  <g class="check" style="animation-delay:3s">
    <rect x="170" y="309" width="260" height="26" rx="13" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
    <text x="300" y="326" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#4ade80" text-anchor="middle">✓ Data reconciliation · 0 violations</text>
  </g>

  <text x="300" y="366" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="13" fill="#6b7280" text-anchor="middle">11 SQL test cases · PostgreSQL 16 · GitHub Actions report</text>
</svg>
