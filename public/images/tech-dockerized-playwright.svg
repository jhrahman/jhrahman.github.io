<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node { transform-box: fill-box; transform-origin: 50% 50%; animation: pulseGlow 5s ease-in-out infinite; }
    @keyframes pulseGlow {
      0%, 78%, 100% { transform: scale(1); }
      8%, 28% { transform: scale(1.12); }
    }
    .flow-dot { animation: travelDot 5s linear infinite; }
    @keyframes travelDot {
      0% { transform: translateX(0); opacity: 0; }
      4% { opacity: 1; }
      92% { opacity: 1; }
      100% { transform: translateX(500px); opacity: 0; }
    }
    .line-dash { stroke-dasharray: 10 8; animation: dashFlow 1.8s linear infinite; }
    @keyframes dashFlow { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: reduce) {
      .node, .flow-dot, .line-dash { animation: none !important; }
    }
  </style>

  <rect width="600" height="400" fill="#111827"/>
  <text x="50" y="60" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#6b7280">CI/CD PIPELINE</text>

  <line x1="50" y1="200" x2="550" y2="200" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line class="line-dash" x1="50" y1="200" x2="550" y2="200" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <circle class="flow-dot" cx="50" cy="200" r="6" fill="#e5e7eb"/>

